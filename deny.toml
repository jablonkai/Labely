# cargo-deny: licence policy from ADR-0002.
[licenses]
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
  "ISC", "Zlib", "Unicode-3.0", "Unicode-DFS-2016", "MPL-2.0", "OFL-1.1", "CC0-1.0",
  "BSL-1.0", "0BSD", "CDLA-Permissive-2.0",
  # egui's bundled Ubuntu-Light UI font (epaint_default_fonts); free to use and redistribute.
  "Ubuntu-font-1.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[advisories]
ignore = [
  # ttf-parser is unmaintained. It has no known vulnerability, and no release of cosmic-text
  # (fontdb 0.23) or winit (ab_glyph via sctk-adwaita) has moved off it yet. Drop this entry
  # when they do.
  { id = "RUSTSEC-2026-0192", reason = "unmaintained only; no upstream replacement yet" },
  # zvariant, zbus_names and zvariant_derive 5.x are unmaintained, superseded by zbus 6. They
  # come only from egui-winit 0.37 (accesskit_unix, the Linux screen-reader bridge), the
  # latest egui. Drop these when egui moves to zbus 6.
  { id = "RUSTSEC-2026-0370", reason = "unmaintained only; pinned by egui-winit 0.37" },
  { id = "RUSTSEC-2026-0371", reason = "unmaintained only; pinned by egui-winit 0.37" },
  { id = "RUSTSEC-2026-0372", reason = "unmaintained only; pinned by egui-winit 0.37" },
  # chrono is unmaintained, with no known vulnerability and no fixed release. rmcp, rxing and
  # schemars depend on it, so dropping it from labely-core would not remove it. Date bindings
  # store chrono strftime patterns in documents, so a replacement has to accept the same
  # patterns. Revisit when those crates move off chrono.
  { id = "RUSTSEC-2026-0543", reason = "unmaintained only; also pulled in by rmcp, rxing and schemars" },
]
