[package]
name = "labely-mcp"
description = "Labely MCP server: stdio (headless or bridge) and Streamable HTTP for the studio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
labely-core.workspace = true
rmcp = { workspace = true, features = [
  "server",
  "client",
  "transport-io",
  "transport-streamable-http-server",
  "transport-streamable-http-client-reqwest",
] }
axum.workspace = true
tokio = { workspace = true, features = ["io-std", "net"] }
tokio-util.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
getrandom.workspace = true

[dev-dependencies]
labely-printers.workspace = true
rmcp = { workspace = true, features = ["client"] }
reqwest.workspace = true
tempfile.workspace = true

[lints]
workspace = true
