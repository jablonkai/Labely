[package]
name = "labely-cli"
description = "Labely command-line interface"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "labely"
path = "src/main.rs"

[features]
default = ["ble", "serial"]
ble = ["labely-printers/ble"]
serial = ["labely-printers/serial"]

[dependencies]
labely-core.workspace = true
labely-printers.workspace = true
labely-mcp.workspace = true
labely-i18n.workspace = true
tokio.workspace = true
clap.workspace = true
serde_json.workspace = true
anyhow.workspace = true
base64.workspace = true
tracing-subscriber.workspace = true


[lints]
workspace = true
