name: Package

# Builds the desktop packages (ADR-0038). It does not publish; the release is slice 6.5.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - crates/studio/packaging/**
      - dist-workspace.toml
      - xtask/**
      - .github/workflows/package.yml

env:
  CARGO_TERM_COLOR: always

jobs:
  package:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux system libraries (BLE, serial, studio, AppImage)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev libudev-dev pkg-config libxkbcommon-dev libwayland-dev libfuse2
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-packager and dist
        run: cargo install --locked cargo-packager@0.11.8 cargo-dist@0.34.0
      - name: Studio packages
        run: cargo xtask package
      - name: CLI archive
        run: dist build --artifacts=local --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v7
        with:
          name: labely-${{ matrix.target }}
          if-no-files-found: error
          path: |
            target/packager/*.dmg
            target/packager/*.msi
            target/packager/*.AppImage
            target/packager/*.deb
            target/distrib/labely-cli-*
